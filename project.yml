name: Appletree
options:
  bundleIdPrefix: jag
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  AppletreeCore:
    path: .
targets:
  Appletree:
    type: application
    platform: macOS
    sources:
      - path: Appletree
        excludes:
          - "*.entitlements"
          - "Info.plist"
    dependencies:
      - package: AppletreeCore
        product: AppletreeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jag.appletree
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Appletree/Appletree.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSDesktopFolderUsageDescription: Appletree reads folders you open so it can show what fills the disk.
        INFOPLIST_KEY_NSDocumentsFolderUsageDescription: Appletree reads folders you open so it can show what fills the disk.
        INFOPLIST_KEY_NSDownloadsFolderUsageDescription: Appletree reads folders you open so it can show what fills the disk.
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: Appletree reads volumes you open so it can show what fills the disk.
    info:
      path: Appletree/Info.plist
      properties:
        CFBundleDisplayName: Appletree
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.folder
